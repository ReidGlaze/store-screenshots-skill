<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{position:relative}
#cap{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;line-height:1.16;letter-spacing:-0.01em}
#cap b,#head b{font-weight:800}
#stage{position:absolute;left:0;top:0;right:0;bottom:0}
#device{position:absolute}
#device img{display:block}
#framed{position:absolute}
#callout{position:absolute;background-repeat:no-repeat;display:none}
#text{position:absolute;display:none;flex-direction:column;justify-content:center}
#name{display:flex;align-items:center;font-weight:700;letter-spacing:-0.01em}
#name img{box-shadow:0 6px 16px rgba(0,0,0,.18)}
#head{font-weight:500;line-height:1.14;letter-spacing:-0.015em}
</style>
</head>
<body>
<div id="cap"><div id="capt"></div></div>
<div id="text"><div id="name"><img id="icon"><span id="appname"></span></div><div id="head"></div></div>
<div id="stage"><div id="device"><img id="raw"></div><img id="framed"><div id="callout"></div></div>
<script>
// render(cfg) lays out one screenshot or the feature graphic. Called by compose.js.
// cfg: { mode:'shot'|'feature', accent, text, background, font, caption, raw, framed,
//        captionHeight, fontSize, callout:{crop:[x,y,w,h],radius,dy,zoom}, screenInset:{x,y,w},
//        appName, icon }
const $ = (id) => document.getElementById(id);
const load = (img, src) => new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = src; });

function alphaBox(img) {
  // Bounding box of non-transparent pixels, as fractions of the image.
  const w = 400, h = Math.round(400 * img.naturalHeight / img.naturalWidth);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 200) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return { x: 0, y: 0, w: 1, h: 1 };
  return { x: x0 / w, y: y0 / h, w: (x1 - x0 + 1) / w, h: (y1 - y0 + 1) / h };
}

async function render(cfg) {
  const W = innerWidth, H = innerHeight;
  document.body.style.background = cfg.background;
  document.body.style.color = cfg.text;
  document.body.style.fontFamily = `"${cfg.font}", -apple-system, "Helvetica Neue", Arial, sans-serif`;
  const accentCss = document.createElement('style');
  accentCss.textContent = `#cap b,#head b{color:${cfg.accent}}`;
  document.head.appendChild(accentCss);

  await load($('raw'), cfg.raw);
  const rawW = $('raw').naturalWidth, rawH = $('raw').naturalHeight;

  // Area the device may occupy: {left, top, width, height}.
  let area;
  if (cfg.mode === 'feature') {
    $('cap').style.display = 'none';
    const t = $('text'); t.style.display = 'flex';
    t.style.left = W * 0.082 + 'px'; t.style.top = 0; t.style.height = H + 'px'; t.style.width = W * 0.51 + 'px';
    $('name').style.fontSize = H * 0.06 + 'px'; $('name').style.gap = H * 0.032 + 'px';
    $('appname').textContent = cfg.appName || '';
    if (cfg.icon) { await load($('icon'), cfg.icon); $('icon').style.width = $('icon').style.height = H * 0.12 + 'px'; $('icon').style.borderRadius = H * 0.028 + 'px'; }
    else $('icon').style.display = 'none';
    $('head').style.fontSize = H * 0.1 + 'px'; $('head').style.marginTop = H * 0.052 + 'px';
    $('head').innerHTML = cfg.caption;
    // Phone on the right, running off the bottom edge.
    area = { left: W * 0.6, top: H * 0.088, width: W * 0.34, height: H * 1.23 };
  } else {
    const capH = H * cfg.captionHeight;
    const cap = $('cap');
    cap.style.height = capH + 'px';
    cap.style.padding = `${H * 0.03}px ${W * 0.07}px 0`;
    cap.style.fontSize = W * cfg.fontSize + 'px';
    $('capt').innerHTML = cfg.caption;
    area = { left: 0, top: capH, width: W, height: H - capH - H * 0.035 };
  }

  // Place the device and work out where its screen is: {l, t, w} in page pixels.
  let screen, devW;
  if (cfg.framed) {
    const img = $('framed');
    await load(img, cfg.framed);
    $('device').style.display = 'none';
    const box = alphaBox(img);
    const aspect = (box.w * img.naturalWidth) / (box.h * img.naturalHeight);
    let dh = area.height, dw = dh * aspect;
    if (dw > area.width * 0.9 && cfg.mode !== 'feature') { dw = area.width * 0.9; dh = dw / aspect; }
    devW = dw;
    const k = dw / (box.w * img.naturalWidth);
    const dl = area.left + (area.width - dw) / 2, dt = area.top;
    img.style.width = img.naturalWidth * k + 'px';
    img.style.left = dl - box.x * img.naturalWidth * k + 'px';
    img.style.top = dt - box.y * img.naturalHeight * k + 'px';
    if (cfg.mode === 'feature') img.style.filter = 'drop-shadow(14px 18px 22px rgba(0,0,0,.22))';
    const ins = Object.assign({ x: 0.039, y: 0.019, w: 0.921 }, cfg.screenInset || {});
    screen = { l: dl + ins.x * dw, t: dt + ins.y * dh, w: ins.w * dw };
  } else {
    // Plain frame drawn in CSS around the raw screenshot.
    $('framed').style.display = 'none';
    const ratio = rawW / rawH;
    let dh = area.height, bz = dh * 0.0115, sw = (dh - 2 * bz) * ratio, dw = sw + 2 * bz;
    if (dw > area.width * 0.9 && cfg.mode !== 'feature') { dw = area.width * 0.9; bz = dw * 0.025; sw = dw - 2 * bz; dh = sw / ratio + 2 * bz; }
    devW = dw;
    const dl = area.left + (area.width - dw) / 2, dt = area.top;
    const dev = $('device');
    dev.style.cssText += `left:${dl}px;top:${dt}px;width:${dw}px;height:${dh}px;padding:${bz}px;background:#0e0e10;border-radius:${dw * 0.135}px;box-shadow:0 0 0 ${Math.max(1, dw * 0.004)}px #3a3a3e, ${dw * 0.02}px ${dw * 0.035}px ${dw * 0.07}px rgba(0,0,0,.28)`;
    $('raw').style.cssText += `width:${sw}px;border-radius:${dw * 0.112}px`;
    screen = { l: dl + bz, t: dt + bz, w: sw };
  }

  // Optional zoomed callout of one region of the raw screenshot.
  if (cfg.callout && cfg.callout.crop && cfg.mode !== 'feature') {
    const [x, y, w, h] = cfg.callout.crop;
    const s = screen.w / rawW;
    const ZW = Math.min(W * 0.94, devW * (cfg.callout.zoom || 1.14)), z = ZW / w, ZH = h * z;
    const zt = screen.t + (y + h / 2) * s - ZH / 2 + (cfg.callout.dy || 0) * H;
    const c = $('callout');
    c.style.cssText += `display:block;width:${ZW}px;height:${ZH}px;left:${(W - ZW) / 2}px;top:${zt}px;background-image:url(${cfg.raw});background-size:${rawW * z}px auto;background-position:${-x * z}px ${-y * z}px;border-radius:${(cfg.callout.radius || 28) * W / 1320}px;box-shadow:0 ${W * 0.023}px ${W * 0.053}px rgba(0,0,0,.38),0 0 0 ${W * 0.0045}px #f4f4f4`;
  }
  await document.fonts.ready;
}
</script>
</body>
</html>
